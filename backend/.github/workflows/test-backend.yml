name: Test Backend

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    env:
      # Если твой compose/контейнер требует эти переменные через .env — ок,
      # но на всякий случай можно задать тут минимум (или использовать GitHub Secrets).
      TAG: latest
      DOCKER_IMAGE_BACKEND: airlines-backend-ci
      STACK_NAME: ci
      DOMAIN: example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker down (clean)
        run: docker compose down -v --remove-orphans

      - name: Create external network traefik-public
        run: docker network create traefik-public || true

      - name: Build backend image
        run: docker compose build backend

      - name: Start backend and wait
        run: docker compose up -d --wait backend

      - name: Run E2E test (inside backend container)
        run: docker compose exec -T backend python -m pytest -q tests/api/routes/test_full.py

      - name: Docker logs (debug on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Docker down (clean)
        if: always()
        run: docker compose down -v --remove-orphans
