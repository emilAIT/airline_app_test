name: Test Docker Compose

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  test-docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker down (clean)
        run: docker compose down -v --remove-orphans

      # У тебя external network, в CI её нет — создаём.
      - name: Create external network traefik-public
        run: docker network create traefik-public || true

      - name: Build backend image
        run: docker compose build backend

      - name: Start backend and wait
        run: docker compose up -d --wait backend

      # Порт не проброшен наружу, поэтому curl делаем изнутри контейнера
      - name: Test backend health (inside container)
        run: docker compose exec -T backend curl -fsS http://localhost:8000/api/v1/utils/health-check/

      - name: Docker logs (debug on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Docker down (clean)
        if: always()
        run: docker compose down -v --remove-orphans
